<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Product, Design, Code — one person, end to end">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070F"/>
      <stop offset="0.5" stop-color="#141034"/>
      <stop offset="1" stop-color="#07070F"/>
    </linearGradient>
    <radialGradient id="tglowA">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tglowB">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tglowC">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="trinityGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" rx="24" fill="url(#tbg)"/>
  <rect width="1200" height="600" rx="24" fill="url(#trinityGrid)"/>
  <ellipse class="blob b1" cx="340" cy="170" rx="280" ry="210" fill="url(#tglowA)"/>
  <ellipse class="blob b2" cx="880" cy="210" rx="280" ry="210" fill="url(#tglowB)"/>
  <ellipse class="blob b3" cx="600" cy="530" rx="320" ry="200" fill="url(#tglowC)"/>

  <circle class="c c1" cx="600" cy="190" r="150"/>
  <circle class="c c2" cx="505" cy="395" r="150"/>
  <circle class="c c3" cx="695" cy="395" r="150"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="20" letter-spacing="3.5" text-anchor="middle">
    <text class="lb l1" x="600" y="26" fill="#67E8F9">PRODUCT</text>
    <text class="lb l2" x="505" y="578" fill="#A78BFA">DESIGN</text>
    <text class="lb l3" x="695" y="578" fill="#F9A8D4">CODE</text>
  </g>

  <circle cx="600" cy="327" r="5" fill="none" stroke="#A5B4FC" stroke-width="1.5" opacity="0.8">
    <animate attributeName="r" values="5;46" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle class="ctr" cx="600" cy="327" r="5" fill="#E0F2FE"/>

  <style>
    .c{fill:none;stroke-width:2.5;stroke-dasharray:943;stroke-dashoffset:943;animation:draw 1200ms cubic-bezier(.22,.61,.36,1) forwards}
    .c1{stroke:#22D3EE;filter:drop-shadow(0 0 9px rgba(34,211,238,0.85))}
    .c2{stroke:#8B5CF6;filter:drop-shadow(0 0 9px rgba(139,92,246,0.85));animation-delay:240ms}
    .c3{stroke:#F472B6;filter:drop-shadow(0 0 9px rgba(244,114,182,0.85));animation-delay:480ms}
    .lb{opacity:0;animation:fade 700ms ease forwards}
    .l1{animation-delay:760ms}
    .l2{animation-delay:960ms}
    .l3{animation-delay:1160ms}
    .ctr{opacity:0;filter:drop-shadow(0 0 10px #A5B4FC);animation:fade 700ms ease 1360ms forwards}
    .blob{animation:drift 16000ms ease-in-out infinite alternate}
    .b2{animation-duration:20000ms;animation-delay:-5000ms}
    .b3{animation-duration:18000ms;animation-delay:-2000ms}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes fade{to{opacity:1}}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(60px,-30px)}}
    @media (prefers-reduced-motion:reduce){
      .c{stroke-dashoffset:0;animation:none}
      .lb,.ctr{opacity:1;animation:none}
      .blob{animation:none}
    }
  </style>
</svg>